[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "Evidence-first technical research API and ingestion worker."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18,<1.19",
  "fastapi>=0.129,<0.130",
  "httpx>=0.28,<0.29",
  "langgraph>=1.2,<1.3",
  "openai>=2.24,<3",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-sdk>=1.39,<2",
  "pgvector>=0.4,<0.5",
  "psycopg[binary,pool]>=3.3,<3.4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "uvicorn[standard]>=0.40,<0.41",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
atlas-api = "atlas.api.main:run"
atlas-worker = "atlas.ingestion.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "contract: API or provider contract tests",
  "database: PostgreSQL integration tests",
  "offline_eval: deterministic offline evaluation tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["atlas"]
mypy_path = "src"
