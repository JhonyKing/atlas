name: Offline Evaluation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  cited-answer-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --project apps/backend --frozen
      - name: Run deterministic cited-answer gate
        run: uv run --project apps/backend atlas-eval run --dataset evals/datasets/cited-answer-v1.jsonl --output evals/results/cited-answer-v1-ci.json
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: cited-answer-v1-evaluation
          path: evals/results/cited-answer-v1-ci.json
