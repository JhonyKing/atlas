name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Immutable release tag or commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      - name: Refuse mutable release references
        shell: bash
        run: test "${{ inputs.release }}" != "main"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web build
      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest
      - name: Deploy immutable production web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --cwd apps/web --yes --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          vercel deploy --cwd apps/web --prod --token "$VERCEL_TOKEN" --yes
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --project apps/backend --frozen
      - name: Apply forward-only migration
        shell: pwsh
        env:
          ATLAS_DATABASE_URL: ${{ secrets.ATLAS_PRODUCTION_DATABASE_URL }}
        run: ./scripts/release-migrate.ps1
      - name: Run deployed smoke gate
        env:
          ATLAS_API_ORIGIN: ${{ secrets.ATLAS_PRODUCTION_API_ORIGIN }}
        run: python scripts/deployment-smoke.py --api-origin "$ATLAS_API_ORIGIN" --output "$RUNNER_TEMP/smoke.json"
      - name: Generate release evidence
        if: always()
        run: python scripts/generate-release-evidence.py --output "$RUNNER_TEMP/release-evidence.json" --source-revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-production-release-evidence
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/smoke.json
