name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONPATH: ${{ github.workspace }}/apps/backend/src:${{ github.workspace }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --project apps/backend --frozen
      - name: Run security regression suite
        run: uv run --project apps/backend pytest apps/backend/tests/security -q
      - name: Scan frontend source for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|OPENAI_API_KEY[[:space:]]*=' -- apps/web; then
            echo "Potential frontend secret detected"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ATLAS_ENV: test
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Run Playwright browser journeys
        env:
          ATLAS_PROD_SERVER: "1"
        run: pnpm --filter @atlas/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres
      - run: docker compose exec -T postgres psql -U atlas -d atlas -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install migration dependencies
        run: uv sync --project apps/backend --frozen
      - name: Apply migrations to a fresh database
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas-local-only@localhost:55432/atlas
        run: uv run --project apps/backend python -m alembic -c database/alembic.ini upgrade head
      - name: Run database contract tests
        shell: bash
        run: |
          set -euo pipefail
          for contract in database/tests/*.sql; do
            echo "Running ${contract}"
            docker compose exec -T postgres psql -U atlas -d atlas -v ON_ERROR_STOP=1 -f - < "${contract}"
          done
      - name: Verify migration head
        run: docker compose exec -T postgres psql -U atlas -d atlas -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version;"

  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --project apps/backend --frozen
      - name: Run deterministic cited-answer evaluation gate
        run: uv run --project apps/backend atlas-eval run --dataset evals/datasets/cited-answer-v1.jsonl --output evals/results/cited-answer-v1-ci.json
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: cited-answer-v1-evaluation
          path: evals/results/cited-answer-v1-ci.json

  deployment-contracts:
    name: Deployment contracts and secret boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --project apps/backend --frozen
      - name: Validate deployment contract tests
        run: >-
          uv run --project apps/backend pytest
          apps/backend/tests/contract/test_deployment_config.py
          apps/backend/tests/contract/test_readiness.py
          apps/backend/tests/contract/test_release_evidence_schema.py
          apps/backend/tests/security/test_deployment_secret_boundary.py -q
      - name: Validate release evidence generator
        shell: bash
        run: |
          python scripts/generate-release-evidence.py --output "$RUNNER_TEMP/release-evidence.json" --source-revision "$GITHUB_SHA"
          python -m json.tool "$RUNNER_TEMP/release-evidence.json" >/dev/null
      - name: Scan deployment surface
        shell: pwsh
        run: ./scripts/verify-deployment-secrets.ps1
