openapi: 3.1.0
info:
  title: ATLAS Reports API
  version: 1.0.0
paths:
  /v1/reports:
    post:
      summary: Create an evidence-backed report job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSpec'
      responses:
        '200':
          description: SSE report progress stream
          content:
            text/event-stream:
              schema:
                type: string
        '400': {description: Invalid report specification}
        '404': {description: Source run is not visible to the visitor}
        '409': {description: Idempotency key conflict}
        '429': {description: Report quota exceeded}
  /v1/reports/{report_id}:
    get:
      summary: Read report job status
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportJob'}
        '404': {description: Not found, expired, or not owned}
    delete:
      summary: Delete a report job and its artifacts
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200': {description: Deleted status}
        '404': {description: Not found or already deleted}
  /v1/reports/{report_id}/download:
    get:
      summary: Download a completed report
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - in: query
          name: format
          required: true
          schema: {type: string, enum: [docx, pdf]}
      responses:
        '200': {description: Report artifact}
        '404': {description: Not found, expired, incomplete, or not owned}
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    ReportId:
      in: path
      name: report_id
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ReportSpec:
      type: object
      additionalProperties: false
      required: [source_run_id, report_type, locale, audience, scope, required_sections, format]
      properties:
        source_run_id: {type: string, format: uuid}
        report_type: {type: string, enum: [comparison, architecture_brief, adr, release_intelligence, research]}
        locale: {type: string, enum: [en-US, es-MX]}
        audience: {type: string, minLength: 1, maxLength: 200}
        scope: {type: string, minLength: 1, maxLength: 1000}
        criteria:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
        required_sections:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        format: {type: string, enum: [docx, pdf]}
    ReportJob:
      type: object
      required: [id, status, report_type, locale, format, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, planning, rendering, completed, failed, cancelled, expired, deleted]}
        report_type: {type: string}
        locale: {type: string, enum: [en-US, es-MX]}
        format: {type: string, enum: [docx, pdf]}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        download_url: {type: string, format: uri, nullable: true}
        limitations: {type: array, items: {type: string}}
