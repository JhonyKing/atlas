openapi: 3.1.0
info:
  title: ATLAS Optional Auth and Private Data Contract
  version: 0.1.0
paths:
  /v1/auth/session:
    post:
      operationId: login
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created; the opaque token is delivered in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: Invalid credentials }
    get:
      operationId: getSession
      responses:
        '200': {description: Authenticated session}
        '401': {description: No authenticated session}
    delete:
      operationId: logout
      responses:
        '204': {description: Session revoked}
  /v1/auth/renew:
    post:
      operationId: renewSession
      responses:
        '200': {description: Renewed session}
        '401': {description: Session cannot be renewed}
  /v1/auth/preferences:
    get:
      operationId: getLocalePreference
      responses:
        '200': {description: Saved locale preference}
        '401': {description: Authentication required}
    patch:
      operationId: updateLocalePreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale: {type: string, enum: [en-US, es-MX]}
      responses:
        '200': {description: Locale preference saved}
        '400': {description: Unsupported locale}
        '401': {description: Authentication required}
  /v1/private/resources:
    get:
      operationId: listPrivateResources
      responses:
        '200': {description: Resources owned by the current user}
        '401': {description: Authentication required}
  /v1/private/resources/{resource_id}:
    delete:
      operationId: deletePrivateResource
      parameters:
        - {in: path, name: resource_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Repeat-safe deletion accepted}
        '404': {description: Not found for this owner}
  /v1/private/uploads:
    post:
      operationId: createPrivateUpload
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      responses:
        '202': {description: Upload quarantined for validation}
        '400': {description: File rejected}
        '401': {description: Authentication required}
  /v1/private/uploads/{upload_id}:
    delete:
      operationId: deletePrivateUpload
      parameters:
        - {in: path, name: upload_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Repeat-safe deletion accepted}
        '404': {description: Not found for this owner}
  /v1/account:
    delete:
      operationId: deleteAccount
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      responses:
        '202': {description: Account deletion accepted}
        '401': {description: Authentication required}
components:
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
    Session:
      type: object
      additionalProperties: false
      required: [session_id, subject_id, issued_at, expires_at]
      properties:
        session_id: {type: string, format: uuid}
        subject_id: {type: string, format: uuid}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    UploadStatus:
      type: string
      enum: [pending, clean, rejected, error, deleted]
