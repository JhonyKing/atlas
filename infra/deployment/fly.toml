# Production runtime profile for the ATLAS API and ingestion worker.
#
# The globally unique Fly application name is intentionally not committed.
# Supply it with `flyctl deploy --app <app-name>` after the operator creates
# the account and approves billing. Runtime secrets belong in Fly's secret
# manager, never in this file.

primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "infra/containers/backend/Dockerfile"

[env]
  ATLAS_ENV = "production"
  ATLAS_CORPUS_MANIFEST = "corpus/manifests/expansion-v1.yaml"
  ATLAS_WORKER_POLL_SECONDS = "10"
  ATLAS_WORKER_MAX_RUNS_PER_CYCLE = "10"
  PORT = "8000"

[processes]
  api = "/entrypoint.sh"
  worker = "atlas-worker --manifest corpus/manifests/expansion-v1.yaml"

[deploy]
  release_command = "alembic -c database/alembic.ini upgrade head"
  release_command_timeout = "10m"
  strategy = "rolling"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
